name: Build APK Quest 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK 34
        run: yes | sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install OpenXR Vendors 3.1.2
        run: mkdir -p addons /tmp/tibo-vendors && wget -q https://github.com/GodotVR/godot_openxr_vendors/releases/download/3.1.2-stable/godotopenxrvendorsaddon.zip -O /tmp/tibo-vendors/vendors.zip && unzip -q /tmp/tibo-vendors/vendors.zip -d /tmp/tibo-vendors/unpacked && rm -rf addons/godotopenxrvendors && if [ -d /tmp/tibo-vendors/unpacked/addons/godotopenxrvendors ]; then cp -R /tmp/tibo-vendors/unpacked/addons/godotopenxrvendors addons/; elif [ -d /tmp/tibo-vendors/unpacked/asset/addons/godotopenxrvendors ]; then cp -R /tmp/tibo-vendors/unpacked/asset/addons/godotopenxrvendors addons/; else echo "Plugin OpenXR Vendors introuvable dans l archive"; find /tmp/tibo-vendors/unpacked -maxdepth 4 -type d; exit 1; fi

      - name: Install Android Gradle build template
        env:
          HOME: /root
        run: rm -rf android && mkdir -p android/build && printf "4.3.stable\n" > android/.build_version && unzip -q /root/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build && touch android/build/.gdignore

      - name: Load OpenXR plugin
        env:
          HOME: /root
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
        run: godot --headless --path . --editor --quit

      - name: Create build directory
        run: mkdir -p build

      - name: Build Quest APK
        env:
          HOME: /root
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
        run: godot --headless --verbose --path . --export-debug "Quest 3" build/tibo-narvalo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tibo-Narvalo-Quest3
          path: build/tibo-narvalo.apk
          if-no-files-found: error
