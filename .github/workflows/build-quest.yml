name: Build APK Quest 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates
        run: mkdir -p ~/.local/share/godot/export_templates && cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true

      - name: Configure Android environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          mkdir -p /root/.config/godot
          printf "[gd_resource type=\"EditorSettings\" format=3]\n\n[resource]\nexport/android/java_sdk_path = \"/usr/lib/jvm/java-17-openjdk-amd64\"\nexport/android/android_sdk_path = \"/usr/lib/android-sdk\"\n" > /root/.config/godot/editor_settings-4.3.tres

      - name: Install Android SDK 34
        run: yes | sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Create build directory
        run: mkdir -p build

      - name: Create Android debug keystore
        run: keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure debug keystore
        run: printf "\nkeystore/debug=\"build/debug.keystore\"\nkeystore/debug_user=\"androiddebugkey\"\nkeystore/debug_password=\"android\"\n" >> export_presets.cfg

      - name: Build Quest APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: godot --headless --path . --export-debug "Quest 3" build/tibo-narvalo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tibo-Narvalo-Quest3
          path: build/tibo-narvalo.apk
          if-no-files-found: error
