name: Check Tibo Narvalo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict Godot check
        run: |
          godot --headless --path . --editor --quit > godot-check.log 2>&1 || {
            cat godot-check.log
            exit 1
          }
          cat godot-check.log
          if grep -E -q "SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot get class" godot-check.log; then
            echo "Godot script errors detected."
            exit 1
          fi
